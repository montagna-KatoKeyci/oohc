baseURL = "https://montagna-katokeyci.github.io/oohc/"
languageCode = "ja-jp"
title = "山とカンツォーネ"
theme = "PaperMod"

# 1. 検索用データ（index.json）を自動生成するための出力設定
[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  # 検索エンジン向けのサイト紹介文（メタディスクリプション）
  description = "奥多摩のオフトレイル・ハイキング（いわゆるバリエーション登山）の記録と、イタリア歌曲の愉しみ。カンツォーネはラップやプログレを含むイタリア歌曲全般を指します。"

  # 2. 検索対象に本文（content）を追加し、詳細検索を有効化
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

[params.homeInfoParams]
Title = "山とカンツォーネについて"
Content = """
● 筆者：モンターニャ  
● 山行記録をなぞった結果について責任を負う意思も能力もありません。  
● カンツォーネは「古いナポリ民謡」ではなく、ラップやプログレを含むイタリア歌曲全般を指します。歌手名と曲名をコピペしてAIに貼り付け、「歌詞訳と世界観を」などと打ち込めば曲の全体像がわかります。"""

# ヘッダーナビゲーションメニュー
[[menu.main]]
name = "トップ"
url = "/"
weight = 10

[[menu.main]]
name = "山行記録"
url = "/categories/山行記録/"
weight = 20

[[menu.main]]
name = "カンツォーネ"
url = "/categories/カンツォーネ/"
weight = 30

[[menu.main]]
name = "雑感"
url = "/categories/雑感/"
weight = 40

[[menu.main]]
name = "プロフィール"
url = "/profile/"
weight = 50

[[menu.main]]
name = "タグ"
url = "/tags/"
weight = 60

[[menu.main]]
name = "アーカイブ"
url = "/archives/"
weight = 70

[[menu.main]]
name = "検索"
url = "/search/"
