<header class="header">
    <nav class="nav">
        <div class="logo">
            <a href="{{ "" | absURL }}" accesskey="h" title="{{ .Site.Title }}">{{ .Site.Title }}</a>
            <div class="logo-switches">
                <button id="theme-toggle" accesskey="t" title="(Alt + T)">
                    <svg id="moon" width="24" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
                    <svg id="sun" width="24" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                </button>
            </div>
        </div>
        <div class="site-subtitle">奥多摩のオフトレイル・ハイキング<br>ときどきカンツォーネ</div>
        
        <div class="menu-container">
            <!-- 上段：4項目 -->
            <ul class="menu-row">
                <li>
                    <a href="{{ "" | absURL }}" title="トップ">
                        <span{{ if .IsHome }} class="active"{{ end }}>トップ</span>
                    </a>
                </li>
                <li>
                    <a href="{{ "categories/山行記録/" | absURL }}" title="山行記録">
                        <span{{ if or (eq .Title "山行記録") (in .Permalink "山行記録") (in .Permalink "%E5%B1%B1%E8%A1%8C%E8%A8%98%E9%8C%B2") }} class="active"{{ end }}>山行記録</span>
                    </a>
                </li>
                <li>
                    <a href="{{ "categories/カンツォーネ/" | absURL }}" title="カンツォーネ">
                        <span{{ if or (eq .Title "カンツォーネ") (in .Permalink "カンツォーネ") (in .Permalink "%E3%82%AB%E3%83%B3%E3%83%84%E3%82%A9%E3%83%BC%E3%83%8D") }} class="active"{{ end }}>カンツォーネ</span>
                    </a>
                </li>
                <li>
                    <a href="{{ "profile/" | absURL }}" title="プロフィール">
                        <span{{ if or (eq .Title "プロフィール") (in .Permalink "profile") }} class="active"{{ end }}>プロフィール</span>
                    </a>
                </li>
            </ul>
            <!-- 下段：3項目 -->
            <ul class="menu-row">
                <li>
                    <a href="{{ "tags/" | absURL }}" title="タグ">
                        <span{{ if or (eq .Title "タグ") (in .Permalink "tags") }} class="active"{{ end }}>タグ</span>
                    </a>
                </li>
                <li>
                    <a href="{{ "archives/" | absURL }}" title="アーカイブ">
                        <span{{ if or (eq .Title "アーカイブ") (in .Permalink "archives") }} class="active"{{ end }}>アーカイブ</span>
                    </a>
                </li>
                <li>
                    <a href="{{ "search/" | absURL }}" title="検索">
                        <span{{ if or (eq .Title "検索") (in .Permalink "search") }} class="active"{{ end }}>検索</span>
                    </a>
                </li>
            </ul>
        </div>
    </nav>
</header>
