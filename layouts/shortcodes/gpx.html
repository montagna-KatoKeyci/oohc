{{ $gpxFile := .Get 0 }}
{{ $uniqueId := substr (md5 $gpxFile) 0 8 }}
{{ $mapId := printf "map-%s" $uniqueId }}
{{ $summaryId := printf "summary-%s" $uniqueId }}
{{ $gpxPath := printf "gpx/%s" $gpxFile | relURL }}

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
  .gpx-container {
    width: 100%;
    margin: 1.5rem 0;
    border: 1px solid #ccc;
    border-radius: 8px;
    overflow: hidden;
    background-color: #fff;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
  }
  .gpx-summary {
    background-color: #f8f9fa;
    padding: 12px 16px;
    border-bottom: 1px solid #e9ecef;
    font-size: 0.9rem;
    color: #333;
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    align-items: center;
  }
  .gpx-summary-item {
    display: flex;
    flex-direction: column;
  }
  .gpx-summary-label {
    font-size: 0.75rem;
    color: #666;
  }
  .gpx-summary-val {
    font-size: 1rem;
    font-weight: bold;
  }
  .gpx-map {
    height: 420px;
    width: 100%;
    z-index: 1;
  }
  body.dark .gpx-container { border-color: #444; background-color: #1a1a1a; }
  body.dark .gpx-summary { background-color: #2a2a2a; border-bottom-color: #444; color: #eee; }
  body.dark .gpx-summary-label { color: #aaa; }
</style>

<div class="gpx-container">
  <!-- ①数値データ -->
  <div id="{{ $summaryId }}" class="gpx-summary">
    <span>データ解析中...</span>
  </div>
  <!-- ②地理院地図＋GPXログ -->
  <div id="{{ $mapId }}" class="gpx-map"></div>
</div>

<!-- JavaScript ライブラリ -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

<script>
window.addEventListener('load', function() {
  var targetUrl = '{{ $gpxPath }}';
  var map = L.map('{{ $mapId }}');

  L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
    attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>',
    maxZoom: 18
  }).addTo(map);

  new L.GPX(targetUrl, {
    async: true,
    polyline_options: { color: '#ff3300', weight: 4, opacity: 0.8 },
    marker_options: {
      startIconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
      endIconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
      shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
      wptIconUrls: { '': null },
      // 最高/最低標高ピン（Max/Min）の自動生成ルールを無効化
      pointMatchers: []
    }
  }).on('loaded', function(e) {
    var gpx = e.target;
    map.fitBounds(gpx.getBounds());

    var distKm = (gpx.get_distance() / 1000).toFixed(2);
    var eleGain = Math.round(gpx.get_elevation_gain());
    var eleLoss = Math.round(gpx.get_elevation_loss());
    var eleMax = Math.round(gpx.get_elevation_max());
    var eleMin = Math.round(gpx.get_elevation_min());

    document.getElementById('{{ $summaryId }}').innerHTML = 
      '<div class="gpx-summary-item"><span class="gpx-summary-label">総距離</span><span class="gpx-summary-val">' + distKm + ' km</span></div>' +
      '<div class="gpx-summary-item"><span class="gpx-summary-label">累積標高（上り）</span><span class="gpx-summary-val">+' + eleGain + ' m</span></div>' +
      '<div class="gpx-summary-item"><span class="gpx-summary-label">累積標高（下り）</span><span class="gpx-summary-val">-' + eleLoss + ' m</span></div>' +
      '<div class="gpx-summary-item"><span class="gpx-summary-label">最高/最低標高</span><span class="gpx-summary-val">' + eleMax + 'm / ' + eleMin + 'm</span></div>';
  }).addTo(map);
});
</script>
