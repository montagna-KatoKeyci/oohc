{{ $gpxFile := .Get 0 }}
{{ $uniqueId := substr (md5 $gpxFile) 0 8 }}
{{ $mapId := printf "map-%s" $uniqueId }}
{{ $summaryId := printf "summary-%s" $uniqueId }}
{{ $elevationId := printf "elevation-%s" $uniqueId }}

<!-- CSSライブラリの読み込み -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet-elevation@2.5.1/dist/leaflet-elevation.min.css" />

<!-- JSライブラリの読み込み -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/d3@7"></script>
<script src="https://unpkg.com/leaflet-elevation@2.5.1/dist/leaflet-elevation.min.js"></script>

<style>
  .gpx-wrapper {
    width: 100%;
    margin: 1.5rem 0;
    border: 1px solid #ccc;
    border-radius: 8px;
    overflow: hidden;
    background-color: #fff;
  }

  /* 1. 最上段：数値データ表示エリア */
  .gpx-summary-bar {
    background-color: #f4f6f8;
    padding: 12px 16px;
    border-bottom: 1px solid #e0e0e0;
    font-size: 0.95rem;
    font-weight: bold;
    color: #333;
  }
  .gpx-summary-bar .elevation-summary {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
  }

  /* 2. 中段：Leaflet地図エリア */
  .gpx-map-area {
    height: 450px;
    width: 100%;
    z-index: 1;
  }

  /* 3. 最下段：標高グラフエリア */
  .gpx-elevation-chart-area {
    height: 180px;
    width: 100%;
    background-color: #fafafa;
    border-top: 1px solid #e0e0e0;
  }

  /* ダークモード対応 */
  body.dark .gpx-wrapper {
    border-color: #444;
    background-color: #1a1a1a;
  }
  body.dark .gpx-summary-bar {
    background-color: #2a2a2a;
    border-bottom-color: #444;
    color: #eee;
  }
  body.dark .gpx-elevation-chart-area {
    background-color: #222;
    border-top-color: #444;
  }
</style>

<div class="gpx-wrapper">
  <!-- 1. 最上段：数値データ枠（GPX解析後に自動挿入） -->
  <div id="{{ $summaryId }}" class="gpx-summary-bar"></div>

  <!-- 2. 中段：Leaflet 地図（GPSログ入り） -->
  <div id="{{ $mapId }}" class="gpx-map-area"></div>

  <!-- 3. 最下段：標高グラフ -->
  <div id="{{ $elevationId }}" class="gpx-elevation-chart-area"></div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
  // 国土地理院タイル（標準地図）の設定
  var stdTile = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
    attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">地理院タイル</a>',
    maxZoom: 18
  });

  // マップ初期化
  var map = L.map('{{ $mapId }}', {
    layers: [stdTile]
  });

  // 標高・統計コントロール設定
  var elevationControl = L.control.elevation({
    theme: "purple-theme",
    detached: true,
    elevationDiv: "#{{ $elevationId }}",   // 最下段に標高グラフを出力
    summaryDiv: "#{{ $summaryId }}",       // 最上段に数値データを出力
    followMarker: true,
    zFollow: 15,
    summary: 'inline',
    distance: true,       // 総距離
    ascent: true,         // 累積標高差（上り）
    descent: true,        // 累積標高差（下り）
    elevation: false,     // サマリーエリアの単体標高表示は非表示
    slope: false,
    speed: false,
    time: false,
    legend: false,
    autofitBounds: true,
    collapse: false
  }).addTo(map);

  // GPXファイルの読み込み（static/gpx/ 配下を参照）
  {{ $gpxPath := printf "gpx/%s" $gpxFile }}
  elevationControl.load('{{ $gpxPath | relURL }}');
});
</script>
