baseURL = 'https://montagna-KatoKeyci.github.io/oohc/'
defaultContentLanguage = 'ja'
title = '山とカンツォーネ'
theme = 'PaperMod'

# 1ページあたりの記事表示数を10個に設定
paginate = 10

[params]
  defaultTheme = 'auto'
  showThemeToggle = true

  [params.label]
    text = "山とカンツォーネ<br><span style='font-size: 0.8rem; font-weight: normal; opacity: 0.8;'>奥多摩のオフトレイル・ハイキングときどきカンツォーネ</span>"

  [params.homeInfoParams]
Title = "山とカンツォーネについて"
Content = """
○ 山行記録をなぞった結果について責任を負う意思も能力もありません。  
○ カンツォーネは「古いナポリ民謡」ではなく、ラップやプログレを含む歌曲全般を指します。歌手名と曲名をコピペしてAIに貼り付け、「歌詞訳と世界観を」などと打ち込めば曲の全体像がわかります。"""

# ヘッダーナビゲーションメニュー
[[menu.main]]
name = "トップ"
url = "/"
weight = 10

[[menu.main]]
name = "山行記録"
url = "/categories/山行記録/"
weight = 20

[[menu.main]]
name = "カンツォーネ"
url = "/categories/カンツォーネ/"
weight = 30

[[menu.main]]
name = "プロフィール"
url = "/profile/"
weight = 40

[[menu.main]]
name = "タグ"
url = "/tags/"
weight = 50

[[menu.main]]
name = "アーカイブ"
url = "/archives/"
weight = 60

[[menu.main]]
name = "検索"
url = "/search/"
weight = 70

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      hardLineBreaks = false